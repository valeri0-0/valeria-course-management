name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: eclipse-temurin:21

    steps:
    - name: clone repository
      uses: actions/checkout@v3

    - name: nastroyka prav mvnw
      run: chmod +x mvnw

    - name: zapusk sborki Maven
      run: ./mvnw clean package

    - name: save artifacts jar
      uses: actions/upload-artifact@v4
      with:
        name: application-jar
        path: target/*.jar
        retention-days: 60

  # SAST
  semgrep-sast:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Semgrep
      run: |
        python3 -m pip install --upgrade pip
        pip3 install semgrep
        semgrep scan --config auto --sarif --output security-report.sarif

    - name: Upload SARIF report to GitHub Security
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: semgrep-report.sarif
        wait-for-processing: true
